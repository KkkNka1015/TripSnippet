# TripSnippet 前端静态托管（hash 路由，SPA 兜底到 index.html）
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 带内容 hash 的构建产物：长缓存
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Service Worker 禁止缓存，保证发版后及时更新
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
